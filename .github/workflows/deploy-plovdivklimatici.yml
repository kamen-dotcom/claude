name: Deploy plovdivklimatici.com

on:
  push:
    branches:
      - claude/plovdivklimatici-website-4opbbj
    paths:
      - 'plovdivklimatici/**'
      - '.github/workflows/deploy-plovdivklimatici.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plovdivklimatici
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: python3 build.py

      - name: Check word counts and duplicate content
        run: python3 check.py

      - name: Check for Cloudflare API token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping deploy. Add it under Settings → Secrets and variables → Actions."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: plovdivklimatici
          command: deploy
