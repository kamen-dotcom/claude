# Cloudflare Worker "uslugivik" (uslugivik.com)
# Deploy from this directory:  npx wrangler deploy
name = "uslugivik"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

# KV namespace for request-form submissions. The id below is the "VIK_LEADS"
# namespace from the account; confirm it matches the Worker's current binding
# in the dashboard (Workers & Pages -> uslugivik -> Settings -> Bindings) before deploying.
[[kv_namespaces]]
binding = "LEADS"
id = "bfe0452ce8b642f9a0ea249fab2d95b3"

# Secret (set with `npx wrangler secret put LEADS_KEY`): key for reading /zayavki.txt?key=...
