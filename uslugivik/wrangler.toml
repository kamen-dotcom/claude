# Cloudflare Worker "uslugivik" (uslugivik.com)
# Deploy from this directory:  npx wrangler deploy
name = "uslugivik"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "uslugivik.com", custom_domain = true },
  { pattern = "www.uslugivik.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

# KV namespace for request-form submissions ("VIK_LEADS"; verified against the live
# Worker's bindings on 2026-09-06).
[[kv_namespaces]]
binding = "LEADS"
id = "bfe0452ce8b642f9a0ea249fab2d95b3"

# LEADS_KEY (key for reading /zayavki.txt?key=...) is set as a variable on the Worker in the
# dashboard, not in this file. Deploy with `npx wrangler deploy --keep-vars` so it is preserved.
