<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the ACE</title>
    <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0d2818 50%, #0a1f13 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            max-width: 800px;
        }

        h1 {
            color: #ffd700;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .score-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .score-value {
            color: #ffd700;
            font-size: 2em;
            font-weight: bold;
        }

        .cards-area {
            position: relative;
            width: 560px;
            height: 280px;
            margin: 40px auto;
            perspective: 1000px;
        }

        .card {
            width: 160px;
            height: 220px;
            position: absolute;
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 15px;
            top: 30px;
        }

        .card[data-position="0"] { left: 0; }
        .card[data-position="1"] { left: 200px; }
        .card[data-position="2"] { left: 400px; }

        .card.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card-back {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            border: 3px solid #ffd700;
        }

        .card-back::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px;
        }

        .card-back-pattern {
            font-size: 4em;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            transform: rotateY(180deg);
            flex-direction: column;
            border: 3px solid #333;
        }

        .card-value {
            font-size: 5em;
            font-weight: bold;
        }

        .card-suit {
            font-size: 2em;
            margin-top: -10px;
        }

        .card.ace .card-value,
        .card.ace .card-suit,
        .card.ace .card-corner {
            color: #c41e3a;
        }

        .card:not(.ace) .card-value,
        .card:not(.ace) .card-suit,
        .card:not(.ace) .card-corner {
            color: #333;
        }

        .card-corner {
            position: absolute;
            font-size: 1.2em;
            font-weight: bold;
            line-height: 1;
        }

        .card-corner.top-left {
            top: 10px;
            left: 12px;
        }

        .card-corner.bottom-right {
            bottom: 10px;
            right: 12px;
            transform: rotate(180deg);
        }

        .controls {
            margin-top: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #1a472a;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            font-size: 2em;
            margin: 20px 0;
            min-height: 50px;
            font-weight: bold;
        }

        .message.win {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .message.lose {
            color: #f87171;
            text-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
        }

        .message.shuffle {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .instructions {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-top: 20px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        .card.winner::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #ffd700, #4ade80, #ffd700);
            border-radius: 18px;
            z-index: -1;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .cards-area {
                width: 330px;
                height: 180px;
            }

            .card {
                width: 100px;
                height: 140px;
                top: 20px;
            }

            .card[data-position="0"] { left: 0; }
            .card[data-position="1"] { left: 115px; }
            .card[data-position="2"] { left: 230px; }

            .card-value {
                font-size: 3em;
            }

            .card-suit {
                font-size: 1.5em;
            }

            .card-back-pattern {
                font-size: 2.5em;
            }

            .score-board {
                gap: 20px;
            }

            .score-item {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Find the ACE</h1>
        <p class="subtitle">Watch the shuffle, then pick the ACE of Hearts!</p>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Wins</div>
                <div class="score-value" id="wins">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Losses</div>
                <div class="score-value" id="losses">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Streak</div>
                <div class="score-value" id="streak">0</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="cards-area" id="cardsArea"></div>

        <div class="controls">
            <button class="btn" id="playBtn" onclick="startGame()">Start Game</button>
        </div>

        <p class="instructions">Click on a card to reveal it after the shuffle</p>
    </div>

    <script>
        const { animate, spring, stagger } = Motion;

        // Game state
        let gameState = {
            wins: 0,
            losses: 0,
            streak: 0,
            isPlaying: false,
            canPick: false,
            cardPositions: [0, 1, 2] // Which card is at which position
        };

        // Card data - index 0 is always ACE
        const cardsData = [
            { value: 'A', suit: '♥', isAce: true },
            { value: 'K', suit: '♠', isAce: false },
            { value: 'Q', suit: '♦', isAce: false }
        ];

        // Position coordinates
        const positions = [0, 200, 400];
        const mobilePositions = [0, 115, 230];

        function getPositions() {
            return window.innerWidth <= 600 ? mobilePositions : positions;
        }

        // Create card HTML
        function createCardHTML(cardData) {
            return `
                <div class="card-face card-back">
                    <span class="card-back-pattern">?</span>
                </div>
                <div class="card-face card-front">
                    <span class="card-corner top-left">${cardData.value}<br>${cardData.suit}</span>
                    <span class="card-value">${cardData.value}</span>
                    <span class="card-suit">${cardData.suit}</span>
                    <span class="card-corner bottom-right">${cardData.value}<br>${cardData.suit}</span>
                </div>
            `;
        }

        // Initialize cards
        function createCards() {
            const cardsArea = document.getElementById('cardsArea');
            cardsArea.innerHTML = '';
            gameState.cardPositions = [0, 1, 2];

            const pos = getPositions();

            cardsData.forEach((cardData, cardIndex) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${cardData.isAce ? 'ace' : ''} disabled`;
                cardEl.dataset.cardIndex = cardIndex;
                cardEl.dataset.position = cardIndex;
                cardEl.style.left = `${pos[cardIndex]}px`;
                cardEl.innerHTML = createCardHTML(cardData);
                cardEl.addEventListener('click', () => pickCard(cardEl));
                cardsArea.appendChild(cardEl);
            });
        }

        // Get card element by card index
        function getCardByIndex(index) {
            return document.querySelector(`.card[data-card-index="${index}"]`);
        }

        // Get card at position
        function getCardAtPosition(pos) {
            const cardIndex = gameState.cardPositions.indexOf(pos);
            return getCardByIndex(cardIndex);
        }

        // Start game
        async function startGame() {
            if (gameState.isPlaying) return;

            gameState.isPlaying = true;
            gameState.canPick = false;

            const playBtn = document.getElementById('playBtn');
            playBtn.disabled = true;
            playBtn.textContent = 'Shuffling...';

            setMessage('Watch the cards...', 'shuffle');

            // Reset cards
            createCards();

            await sleep(300);

            // Show all cards (flip face up)
            await showAllCards();

            // Wait for player to see
            await sleep(1500);

            // Hide all cards (flip face down)
            await hideAllCards();

            await sleep(300);

            // Shuffle animation
            await shuffleCards();

            setMessage('Pick the ACE!', 'shuffle');
            gameState.canPick = true;

            // Enable clicking
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('disabled');
            });

            playBtn.textContent = 'Pick a Card';
        }

        // Show all cards
        async function showAllCards() {
            const cards = document.querySelectorAll('.card');
            const promises = [];

            cards.forEach((card, i) => {
                promises.push(
                    animate(card,
                        { rotateY: 180 },
                        { duration: 0.6, delay: i * 0.15, easing: spring({ stiffness: 200, damping: 20 }) }
                    ).finished
                );
            });

            await Promise.all(promises);
        }

        // Hide all cards
        async function hideAllCards() {
            const cards = document.querySelectorAll('.card');
            const promises = [];

            cards.forEach((card, i) => {
                promises.push(
                    animate(card,
                        { rotateY: 0 },
                        { duration: 0.6, delay: i * 0.1, easing: spring({ stiffness: 200, damping: 20 }) }
                    ).finished
                );
            });

            await Promise.all(promises);
        }

        // Swap two cards visually and update positions
        async function swapTwoCards(pos1, pos2) {
            const posCoords = getPositions();

            // Find which cards are at these positions
            const cardIndex1 = gameState.cardPositions.indexOf(pos1);
            const cardIndex2 = gameState.cardPositions.indexOf(pos2);

            const card1 = getCardByIndex(cardIndex1);
            const card2 = getCardByIndex(cardIndex2);

            if (!card1 || !card2) return;

            const x1 = posCoords[pos1];
            const x2 = posCoords[pos2];

            // Animate cards swapping
            const anim1 = animate(card1,
                {
                    x: [0, 0, 0],
                    left: [`${x1}px`, `${x1}px`, `${x2}px`],
                    y: [0, -60, 0],
                    zIndex: [1, 10, 1]
                },
                { duration: 0.4, easing: [0.4, 0, 0.2, 1] }
            );

            const anim2 = animate(card2,
                {
                    x: [0, 0, 0],
                    left: [`${x2}px`, `${x2}px`, `${x1}px`],
                    y: [0, 60, 0],
                    zIndex: [1, 5, 1]
                },
                { duration: 0.4, easing: [0.4, 0, 0.2, 1] }
            );

            await Promise.all([anim1.finished, anim2.finished]);

            // Update positions in state
            gameState.cardPositions[cardIndex1] = pos2;
            gameState.cardPositions[cardIndex2] = pos1;

            // Update data attributes
            card1.dataset.position = pos2;
            card2.dataset.position = pos1;
        }

        // Shuffle cards
        async function shuffleCards() {
            const shuffleCount = 5 + Math.floor(Math.random() * 4); // 5-8 shuffles

            for (let i = 0; i < shuffleCount; i++) {
                // Pick two different positions to swap
                const swapType = Math.floor(Math.random() * 3);

                let pos1, pos2;
                if (swapType === 0) {
                    pos1 = 0; pos2 = 1; // Left and middle
                } else if (swapType === 1) {
                    pos1 = 1; pos2 = 2; // Middle and right
                } else {
                    pos1 = 0; pos2 = 2; // Left and right
                }

                await swapTwoCards(pos1, pos2);
                await sleep(100);
            }
        }

        // Pick a card
        async function pickCard(cardEl) {
            if (!gameState.canPick || !gameState.isPlaying) return;

            gameState.canPick = false;

            // Disable all cards
            document.querySelectorAll('.card').forEach(card => {
                card.classList.add('disabled');
            });

            const isAce = cardEl.classList.contains('ace');

            // Flip the picked card
            await animate(cardEl,
                { rotateY: 180, scale: 1.1 },
                { duration: 0.5, easing: spring({ stiffness: 200, damping: 15 }) }
            ).finished;

            if (isAce) {
                // WIN!
                gameState.wins++;
                gameState.streak++;
                cardEl.classList.add('winner');
                setMessage('YOU WIN! 🎉', 'win');
                updateScore();
                createConfetti();

                // Celebration animation
                animate(cardEl,
                    { y: [0, -30, 0, -15, 0] },
                    { duration: 0.6, easing: 'ease-out' }
                );
            } else {
                // LOSE
                gameState.losses++;
                gameState.streak = 0;
                setMessage('Wrong card! 😢', 'lose');
                updateScore();

                // Shake animation
                animate(cardEl,
                    { x: [0, -15, 15, -15, 15, 0] },
                    { duration: 0.5, easing: 'ease-in-out' }
                );

                // Show the ace after a moment
                await sleep(600);
                const aceCard = document.querySelector('.card.ace');
                if (aceCard) {
                    await animate(aceCard,
                        { rotateY: 180, scale: 1.05 },
                        { duration: 0.5, easing: spring({ stiffness: 200, damping: 20 }) }
                    ).finished;
                }
            }

            // Reset for next game
            await sleep(2000);
            gameState.isPlaying = false;
            const playBtn = document.getElementById('playBtn');
            playBtn.disabled = false;
            playBtn.textContent = 'Play Again';
            setMessage('', '');
        }

        // Update score display
        function updateScore() {
            animate('#wins', { scale: [1, 1.3, 1] }, { duration: 0.3 });
            animate('#losses', { scale: [1, 1.3, 1] }, { duration: 0.3 });
            animate('#streak', { scale: [1, 1.3, 1] }, { duration: 0.3 });

            document.getElementById('wins').textContent = gameState.wins;
            document.getElementById('losses').textContent = gameState.losses;
            document.getElementById('streak').textContent = gameState.streak;
        }

        // Set message
        function setMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;

            if (text) {
                animate(message,
                    { scale: [0.8, 1.1, 1], opacity: [0, 1] },
                    { duration: 0.4, easing: spring() }
                );
            }
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#ffd700', '#4ade80', '#ff6b6b', '#60a5fa', '#f472b6'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = `${5 + Math.random() * 10}px`;
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);

                animate(confetti,
                    {
                        y: [0, window.innerHeight + 50],
                        x: [(Math.random() - 0.5) * 200],
                        rotate: [0, Math.random() * 720],
                        opacity: [1, 0]
                    },
                    { duration: 2 + Math.random(), easing: 'ease-out' }
                ).finished.then(() => confetti.remove());
            }
        }

        // Helper
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createCards();

            // Entrance animation
            animate('.game-container',
                { opacity: [0, 1], y: [30, 0] },
                { duration: 0.6, easing: 'ease-out' }
            );

            animate('.card',
                { scale: [0, 1], rotate: [-10, 0] },
                { duration: 0.5, delay: stagger(0.1), easing: spring({ stiffness: 200, damping: 15 }) }
            );
        });

        // Handle resize
        window.addEventListener('resize', () => {
            if (!gameState.isPlaying) {
                const pos = getPositions();
                document.querySelectorAll('.card').forEach(card => {
                    const position = parseInt(card.dataset.position);
                    card.style.left = `${pos[position]}px`;
                });
            }
        });
    </script>
</body>
</html>
