<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the ACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(120, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 0, 150, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 200, 255, 0.1) 0%, transparent 60%);
            animation: gradientShift 10s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ec4899, #f97316);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-30px, 50px) scale(0.95); }
            75% { transform: translate(-50px, -20px) scale(1.05); }
        }

        .game-container {
            text-align: center;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 4em;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b, #ffd700, #4ade80);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            letter-spacing: -2px;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1em;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .score-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .score-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cards-area {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 50px auto;
            perspective: 1500px;
            min-height: 300px;
            align-items: center;
        }

        .card {
            width: 180px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover:not(.disabled) {
            transform: translateY(-10px);
        }

        .card.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .card-back {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            overflow: hidden;
        }

        .card-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: cardShine 3s ease-in-out infinite;
        }

        @keyframes cardShine {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .card-back::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 215, 0, 0.03) 10px,
                rgba(255, 215, 0, 0.03) 20px
            );
        }

        .card-back-pattern {
            font-size: 4em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            z-index: 1;
        }

        .card-front {
            background: linear-gradient(145deg, #ffffff 0%, #f8f8f8 100%);
            transform: rotateY(180deg);
            flex-direction: column;
            border: none;
        }

        .card-value {
            font-size: 5.5em;
            font-weight: 800;
            line-height: 1;
        }

        .card-suit {
            font-size: 2.5em;
            margin-top: -5px;
        }

        .card.ace .card-value,
        .card.ace .card-suit,
        .card.ace .card-corner {
            color: #dc2626;
        }

        .card.ace .card-front {
            background: linear-gradient(145deg, #fff5f5 0%, #ffffff 100%);
        }

        .card:not(.ace) .card-value,
        .card:not(.ace) .card-suit,
        .card:not(.ace) .card-corner {
            color: #1f2937;
        }

        .card-corner {
            position: absolute;
            font-size: 1.3em;
            font-weight: 700;
            line-height: 1;
        }

        .card-corner.top-left {
            top: 12px;
            left: 14px;
        }

        .card-corner.bottom-right {
            bottom: 12px;
            right: 14px;
            transform: rotate(180deg);
        }

        .controls {
            margin-top: 40px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            color: #0a0a0f;
            border: none;
            padding: 18px 60px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 40px rgba(255, 215, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 20px 60px rgba(255, 215, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            font-size: 2.2em;
            margin: 25px 0;
            min-height: 60px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .message.win {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(74, 222, 128, 0.5));
        }

        .message.lose {
            background: linear-gradient(135deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(248, 113, 113, 0.5));
        }

        .message.shuffle {
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        .instructions {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9em;
            margin-top: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        /* Firework particle */
        .firework {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Star sparkle */
        .sparkle {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
        }

        /* Screen flash */
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
        }

        /* Gold coins */
        .coin {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
        }

        .card.winner::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: linear-gradient(45deg, #ffd700, #4ade80, #ffd700, #ff6b6b);
            background-size: 400% 400%;
            border-radius: 24px;
            z-index: -1;
            animation: winnerGlow 2s ease-in-out infinite;
            filter: blur(8px);
        }

        @keyframes winnerGlow {
            0%, 100% { background-position: 0% 50%; opacity: 0.8; }
            50% { background-position: 100% 50%; opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5em; }
            .subtitle { font-size: 0.9em; margin-bottom: 25px; }
            .cards-area { gap: 20px; }
            .card { width: 110px; height: 155px; }
            .card-value { font-size: 3.5em; }
            .card-suit { font-size: 1.8em; }
            .card-back-pattern { font-size: 2.5em; }
            .score-board { gap: 12px; flex-wrap: wrap; }
            .score-item { padding: 12px 20px; }
            .score-value { font-size: 2em; }
            .btn { padding: 15px 40px; font-size: 1em; }
            .message { font-size: 1.6em; }
            .orb { display: none; }
        }

        /* Win Popup Styles - Modern 2026 */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 50px 60px;
            text-align: center;
            max-width: 450px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(255, 215, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .popup-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5), transparent);
        }

        .popup-content::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            animation: popupPulse 3s ease-in-out infinite;
        }

        @keyframes popupPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .popup-title {
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .popup-prize {
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        .popup-bonus {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        .popup-btn {
            background: linear-gradient(135deg, #ffd700 0%, #f59e0b 100%);
            color: #0a0a0f;
            border: none;
            padding: 18px 50px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 40px rgba(255, 215, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .popup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: btnShine 2s ease-in-out infinite;
        }

        @keyframes btnShine {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .popup-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 20px 60px rgba(255, 215, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="game-container">
        <h1>Find the ACE</h1>
        <p class="subtitle">Watch the shuffle, then pick the ACE of Hearts!</p>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Wins</div>
                <div class="score-value" id="wins">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Losses</div>
                <div class="score-value" id="losses">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Streak</div>
                <div class="score-value" id="streak">0</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="cards-area" id="cardsArea"></div>

        <div class="controls">
            <button class="btn" id="playBtn">Start Game</button>
        </div>

        <p class="instructions">Click on a card to reveal it after the shuffle</p>
    </div>

    <!-- Screen Flash Effect -->
    <div class="screen-flash" id="screenFlash"></div>

    <!-- Win Popup -->
    <div class="popup-overlay" id="winPopup">
        <div class="popup-content">
            <h2 class="popup-title">🎉 CONGRATULATIONS! 🎉</h2>
            <p class="popup-prize">You won 100 Free Spins</p>
            <p class="popup-bonus">and 40 Euro No Deposit Money!</p>
            <a href="https://winbet.bg" class="popup-btn" target="_blank">Click Here to Continue</a>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            wins: 0,
            losses: 0,
            streak: 0,
            isPlaying: false,
            canPick: false
        };

        // Cards array - will be shuffled
        let cards = [
            { id: 'ace', value: 'A', suit: '♥', isAce: true },
            { id: 'king', value: 'K', suit: '♠', isAce: false },
            { id: 'queen', value: 'Q', suit: '♦', isAce: false }
        ];

        // Sleep helper
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // Get gap between cards
        function getGap() {
            return window.innerWidth <= 600 ? 115 : 190;
        }

        // Create card HTML
        function createCardElement(cardData, index) {
            const card = document.createElement('div');
            card.className = `card ${cardData.isAce ? 'ace' : ''} disabled`;
            card.dataset.id = cardData.id;
            card.dataset.index = index;
            card.innerHTML = `
                <div class="card-face card-back">
                    <span class="card-back-pattern">?</span>
                </div>
                <div class="card-face card-front">
                    <span class="card-corner top-left">${cardData.value}<br>${cardData.suit}</span>
                    <span class="card-value">${cardData.value}</span>
                    <span class="card-suit">${cardData.suit}</span>
                    <span class="card-corner bottom-right">${cardData.value}<br>${cardData.suit}</span>
                </div>
            `;
            return card;
        }

        // Render cards
        function renderCards() {
            const area = document.getElementById('cardsArea');
            area.innerHTML = '';
            cards.forEach((cardData, i) => {
                const card = createCardElement(cardData, i);
                card.addEventListener('click', () => pickCard(card, cardData));
                area.appendChild(card);
            });
        }

        // Swap two cards with animation
        async function swapCardsAnimation(index1, index2) {
            const cardEls = document.querySelectorAll('.card');
            const card1 = cardEls[index1];
            const card2 = cardEls[index2];
            const gap = getGap();

            // Calculate distance to move
            const distance = (index2 - index1) * gap;

            return new Promise(resolve => {
                const tl = gsap.timeline({ onComplete: () => {
                    // Swap in the array
                    [cards[index1], cards[index2]] = [cards[index2], cards[index1]];
                    // Re-render to reflect new order
                    renderCards();
                    resolve();
                }});

                // Card 1 moves forward (up arc)
                tl.to(card1, {
                    x: distance,
                    y: -80,
                    zIndex: 10,
                    duration: 0.2,
                    ease: "power2.out"
                }, 0);
                tl.to(card1, {
                    y: 0,
                    duration: 0.2,
                    ease: "power2.in"
                }, 0.2);

                // Card 2 moves backward (down arc)
                tl.to(card2, {
                    x: -distance,
                    y: 80,
                    zIndex: 5,
                    duration: 0.2,
                    ease: "power2.out"
                }, 0);
                tl.to(card2, {
                    y: 0,
                    duration: 0.2,
                    ease: "power2.in"
                }, 0.2);
            });
        }

        // Shuffle cards
        async function shuffleCards() {
            const numShuffles = 5 + Math.floor(Math.random() * 4); // 5-8 shuffles

            for (let i = 0; i < numShuffles; i++) {
                const pattern = Math.floor(Math.random() * 3);

                if (pattern === 0) {
                    await swapCardsAnimation(0, 1);
                } else if (pattern === 1) {
                    await swapCardsAnimation(1, 2);
                } else {
                    await swapCardsAnimation(0, 2);
                }

                await sleep(100);
            }
        }

        // Flip all cards up
        async function flipAllUp() {
            const cardEls = document.querySelectorAll('.card');
            return new Promise(resolve => {
                gsap.to(cardEls, {
                    rotateY: 180,
                    duration: 0.6,
                    stagger: 0.1,
                    ease: "back.out(1.7)",
                    onComplete: resolve
                });
            });
        }

        // Flip all cards down
        async function flipAllDown() {
            const cardEls = document.querySelectorAll('.card');
            return new Promise(resolve => {
                gsap.to(cardEls, {
                    rotateY: 0,
                    duration: 0.6,
                    stagger: 0.1,
                    ease: "back.out(1.7)",
                    onComplete: resolve
                });
            });
        }

        // Start game
        async function startGame() {
            if (gameState.isPlaying) return;

            gameState.isPlaying = true;
            gameState.canPick = false;

            const btn = document.getElementById('playBtn');
            btn.disabled = true;
            btn.textContent = 'Shuffling...';

            // Reset cards to original order
            cards = [
                { id: 'ace', value: 'A', suit: '♥', isAce: true },
                { id: 'king', value: 'K', suit: '♠', isAce: false },
                { id: 'queen', value: 'Q', suit: '♦', isAce: false }
            ];

            renderCards();
            setMessage('Watch the cards...', 'shuffle');

            await sleep(300);

            // Show cards
            await flipAllUp();
            await sleep(1500);

            // Hide cards
            await flipAllDown();
            await sleep(400);

            setMessage('Shuffling...', 'shuffle');

            // Shuffle
            await shuffleCards();

            setMessage('Pick the ACE!', 'shuffle');
            gameState.canPick = true;

            // Enable clicking
            document.querySelectorAll('.card').forEach(c => c.classList.remove('disabled'));
            btn.textContent = 'Pick a Card';
        }

        // Pick a card
        async function pickCard(cardEl, cardData) {
            if (!gameState.canPick || !gameState.isPlaying) return;
            gameState.canPick = false;

            // Disable all cards
            document.querySelectorAll('.card').forEach(c => c.classList.add('disabled'));

            // Flip picked card
            await new Promise(resolve => {
                gsap.to(cardEl, {
                    rotateY: 180,
                    scale: 1.1,
                    duration: 0.5,
                    ease: "back.out(1.7)",
                    onComplete: resolve
                });
            });

            if (cardData.isAce) {
                // WIN - SPECTACULAR CELEBRATION!
                gameState.wins++;
                gameState.streak++;
                cardEl.classList.add('winner');

                // Screen flash
                screenFlash();

                // Dramatic card animation
                const tl = gsap.timeline();
                tl.to(cardEl, {
                    scale: 1.5,
                    y: -50,
                    duration: 0.3,
                    ease: "back.out(2)"
                });
                tl.to(cardEl, {
                    rotation: 360,
                    duration: 0.5,
                    ease: "power2.inOut"
                });
                tl.to(cardEl, {
                    scale: 1.2,
                    y: -30,
                    rotation: 0,
                    duration: 0.3,
                    ease: "elastic.out(1, 0.5)"
                });

                // Start all effects
                setMessage('YOU WIN! 🎉', 'win');
                updateScore();

                // Multiple waves of effects
                createConfetti();
                createFireworks();
                createSparkles();
                createCoins();

                await sleep(300);
                createConfetti();
                createFireworks();

                await sleep(300);
                createSparkles();
                createCoins();

                // Bounce animation
                gsap.to(cardEl, {
                    y: -30,
                    duration: 0.3,
                    ease: "power2.out",
                    yoyo: true,
                    repeat: 5
                });

                // Show win popup after animation
                await sleep(1500);
                showWinPopup();
            } else {
                // LOSE
                gameState.losses++;
                gameState.streak = 0;
                setMessage('Wrong card! 😢', 'lose');
                updateScore();

                gsap.to(cardEl, {
                    x: "+=15",
                    duration: 0.1,
                    ease: "power2.inOut",
                    yoyo: true,
                    repeat: 5
                });

                // Show ace
                await sleep(500);
                const aceEl = document.querySelector('.card.ace');
                if (aceEl) {
                    await new Promise(resolve => {
                        gsap.to(aceEl, {
                            rotateY: 180,
                            scale: 1.05,
                            duration: 0.5,
                            ease: "back.out(1.7)",
                            onComplete: resolve
                        });
                    });
                }
            }

            // Reset for next game
            await sleep(2000);
            gameState.isPlaying = false;
            const btn = document.getElementById('playBtn');
            btn.disabled = false;
            btn.textContent = 'Play Again';
            setMessage('', '');
        }

        // Update score
        function updateScore() {
            document.getElementById('wins').textContent = gameState.wins;
            document.getElementById('losses').textContent = gameState.losses;
            document.getElementById('streak').textContent = gameState.streak;

            gsap.fromTo(['#wins', '#losses', '#streak'],
                { scale: 1 },
                { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }
            );
        }

        // Set message
        function setMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            if (text) {
                gsap.fromTo(msg,
                    { scale: 0.8, opacity: 0 },
                    { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }
                );
            }
        }

        // Confetti - enhanced
        function createConfetti() {
            const colors = ['#ffd700', '#4ade80', '#ff6b6b', '#60a5fa', '#f472b6', '#ffffff'];
            for (let i = 0; i < 80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = `${Math.random() * 100}vw`;
                c.style.top = '-10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                c.style.width = `${5 + Math.random() * 15}px`;
                c.style.height = c.style.width;
                c.style.boxShadow = `0 0 ${5 + Math.random() * 10}px ${colors[Math.floor(Math.random() * colors.length)]}`;
                document.body.appendChild(c);

                gsap.to(c, {
                    y: window.innerHeight + 50,
                    x: `+=${(Math.random() - 0.5) * 400}`,
                    rotation: Math.random() * 1080,
                    opacity: 0,
                    duration: 2.5 + Math.random() * 1.5,
                    ease: "power1.out",
                    onComplete: () => c.remove()
                });
            }
        }

        // Screen flash effect
        function screenFlash() {
            const flash = document.getElementById('screenFlash');
            gsap.timeline()
                .to(flash, { opacity: 0.8, duration: 0.1 })
                .to(flash, { opacity: 0, duration: 0.3 });
        }

        // Fireworks effect
        function createFireworks() {
            const colors = ['#ffd700', '#ff6b6b', '#4ade80', '#60a5fa', '#f472b6'];
            const positions = [
                { x: window.innerWidth * 0.2, y: window.innerHeight * 0.3 },
                { x: window.innerWidth * 0.8, y: window.innerHeight * 0.3 },
                { x: window.innerWidth * 0.5, y: window.innerHeight * 0.2 },
                { x: window.innerWidth * 0.3, y: window.innerHeight * 0.5 },
                { x: window.innerWidth * 0.7, y: window.innerHeight * 0.5 }
            ];

            positions.forEach((pos, idx) => {
                setTimeout(() => {
                    const color = colors[idx % colors.length];
                    for (let i = 0; i < 30; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework';
                        particle.style.left = pos.x + 'px';
                        particle.style.top = pos.y + 'px';
                        particle.style.background = color;
                        particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
                        document.body.appendChild(particle);

                        const angle = (i / 30) * Math.PI * 2;
                        const velocity = 100 + Math.random() * 150;
                        const destX = Math.cos(angle) * velocity;
                        const destY = Math.sin(angle) * velocity;

                        gsap.to(particle, {
                            x: destX,
                            y: destY,
                            opacity: 0,
                            scale: 0,
                            duration: 1 + Math.random() * 0.5,
                            ease: "power2.out",
                            onComplete: () => particle.remove()
                        });
                    }
                }, idx * 150);
            });
        }

        // Sparkles effect
        function createSparkles() {
            const sparkleChars = ['✨', '⭐', '🌟', '💫', '✦'];
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
                sparkle.style.left = `${Math.random() * 100}vw`;
                sparkle.style.top = `${Math.random() * 100}vh`;
                sparkle.style.fontSize = `${15 + Math.random() * 25}px`;
                document.body.appendChild(sparkle);

                gsap.fromTo(sparkle,
                    { scale: 0, rotation: 0, opacity: 1 },
                    {
                        scale: 1.5,
                        rotation: 360,
                        opacity: 0,
                        duration: 1 + Math.random(),
                        ease: "power2.out",
                        onComplete: () => sparkle.remove()
                    }
                );
            }
        }

        // Gold coins effect
        function createCoins() {
            const coinChars = ['🪙', '💰', '💵', '💎'];
            for (let i = 0; i < 20; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.textContent = coinChars[Math.floor(Math.random() * coinChars.length)];
                coin.style.left = `${30 + Math.random() * 40}vw`;
                coin.style.top = `${window.innerHeight * 0.4}px`;
                document.body.appendChild(coin);

                gsap.to(coin, {
                    y: -(200 + Math.random() * 300),
                    x: (Math.random() - 0.5) * 300,
                    rotation: Math.random() * 720,
                    opacity: 0,
                    duration: 1.5 + Math.random(),
                    delay: Math.random() * 0.5,
                    ease: "power2.out",
                    onComplete: () => coin.remove()
                });
            }
        }

        // Show win popup
        function showWinPopup() {
            const popup = document.getElementById('winPopup');
            popup.classList.add('active');
            gsap.fromTo(popup.querySelector('.popup-content'),
                { scale: 0.8, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }
            );
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
            document.getElementById('playBtn').addEventListener('click', startGame);
            gsap.from('.game-container', { opacity: 0, y: 30, duration: 0.6, onComplete: () => {
                // Auto-start the game when page loads
                startGame();
            }});
        });
    </script>
</body>
</html>
