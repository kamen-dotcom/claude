<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пловдив: Игра по картата</title>
<style>
:root{
  --paper:#f4f1ec; --block:#dcd5cc; --ink:#33393f; --muted:#82878d;
  --red:#d5493a; --green:#3f9d6d; --river:#a3c6e4; --line:#c9c1b7; --card:#fffdf9;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:none;
}
#game{position:fixed; inset:0; touch-action:none; display:block}
/* ---------- HUD ---------- */
#hud{
  position:fixed; top:10px; left:10px; right:10px; display:flex; gap:8px;
  align-items:flex-start; pointer-events:none; flex-wrap:wrap; z-index:5;
}
.chip{
  background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:6px 12px; box-shadow:0 2px 6px rgba(60,50,40,.12);
  display:flex; flex-direction:column; gap:1px; min-width:64px;
}
.chip .lbl{font-size:9px; font-weight:700; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.chip .val{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15}
.chip .val.small{font-size:14px; font-weight:700}
#time.low .val{color:var(--red)}
#target .val{white-space:nowrap; max-width:56vw; overflow:hidden; text-overflow:ellipsis}
#mini{
  position:fixed; right:10px; bottom:10px; z-index:5;
  border:2px solid var(--ink); border-radius:4px; background:var(--paper);
  box-shadow:0 3px 10px rgba(60,50,40,.25); pointer-events:none;
}
/* ---------- overlays ---------- */
#ov{
  position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:rgba(51,57,63,.45); backdrop-filter:blur(2px); padding:18px;
}
#ov.hide{display:none}
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  max-width:470px; width:100%; padding:26px 26px 22px;
  box-shadow:0 14px 44px rgba(40,32,24,.35);
  max-height:88vh; overflow-y:auto;
}
.eyebrow{font-size:10px; font-weight:800; letter-spacing:.22em; color:var(--red); text-transform:uppercase; margin-bottom:8px}
h1{font-size:44px; font-weight:900; letter-spacing:.02em; line-height:1; text-wrap:balance}
h1 .pin{color:var(--red)}
h2{font-size:24px; font-weight:800; line-height:1.15; text-wrap:balance}
.sub{color:var(--muted); font-size:13px; font-weight:600; margin-top:3px}
.rule{height:1px; background:var(--line); margin:14px 0}
.panel p{font-size:14.5px; line-height:1.55}
.hint{display:flex; gap:10px; align-items:baseline; font-size:13.5px; line-height:1.45; margin-top:8px}
.hint b{flex:none; color:var(--red); font-weight:800}
button{
  margin-top:18px; width:100%; padding:13px; border:none; border-radius:9px;
  background:var(--red); color:#fff; font-size:16px; font-weight:800; letter-spacing:.05em;
  cursor:pointer; font-family:inherit;
}
button:hover{background:#c03f31}
button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.numrow{display:flex; gap:12px; align-items:center; margin-bottom:10px}
.num{
  flex:none; width:38px; height:38px; border-radius:50%; background:var(--red); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px;
}
.bonus{
  display:inline-block; margin-top:12px; padding:4px 10px; border-radius:20px;
  background:#e8f4ec; color:var(--green); font-weight:800; font-size:13px;
}
.stat{font-size:15px; margin-top:6px}
.stat b{font-variant-numeric:tabular-nums}
#toast{
  position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-8px);
  background:#33393f; color:#fff; font-weight:700; font-size:14px;
  padding:10px 18px; border-radius:9px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:8;
  max-width:88vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.opt{margin-top:8px; width:100%; padding:11px 12px; border-radius:9px; border:2px solid var(--line); background:#fff; color:var(--ink); font-size:14.5px; font-weight:700; text-align:left; cursor:pointer; font-family:inherit; letter-spacing:0}
.opt:hover{border-color:var(--muted); background:#fff}
.opt.correct{border-color:var(--green); background:#e8f4ec}
.opt.wrong{border-color:var(--red); background:#fbe9e7}
.badge{display:inline-block; margin:8px 6px 0 0; padding:4px 10px; border-radius:20px; background:#f0ece5; color:#6b5f4e; font-weight:800; font-size:12.5px}
.photo{width:calc(100% + 52px); margin:-26px -26px 6px; border-radius:13px 13px 0 0; height:168px; object-fit:cover; display:block; background:#e6e1da}
.cred{font-size:9.5px; color:var(--muted); text-align:right; margin:0 0 12px}
@media (prefers-reduced-motion: no-preference){
  .panel{animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1}}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="chip" id="time"><span class="lbl">Време</span><span class="val" id="timeVal">3:30</span></div>
  <div class="chip"><span class="lbl">Обекти</span><span class="val" id="cntVal">0/12</span></div>
  <div class="chip" id="target"><span class="lbl">Следваща цел</span><span class="val small" id="tgtVal">—</span></div>
  <div class="chip" id="buff" style="display:none"><span class="lbl">Бонуси</span><span class="val small" id="buffVal"></span></div>
</div>
<canvas id="mini" width="172" height="122"></canvas>
<div id="toast"></div>
<div id="ov"><div class="panel" id="panel"></div></div>

/* ================= block generation ================= */
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  let t=l2? ((px-ax)*dx+(py-ay)*dy)/l2 : 0; t=Math.max(0,Math.min(1,t));
  const x=ax+t*dx, y=ay+t*dy; return Math.hypot(px-x,py-y);
}
function rectSamples(r){
  const out=[];
  for(let i=0;i<=4;i++) for(let j=0;j<=4;j++) out.push([r.x+r.w*i/4, r.y+r.h*j/4]);
  return out;
}
const blocks=[];
(function genBlocks(){
  const cw=108, ch=86, st=30;
  for(let gy=0; gy<Math.floor(WH/ch); gy++){
    for(let gx=0; gx<Math.floor(WW/cw); gx++){
      const jx=(rnd()-0.5)*8, jy=(rnd()-0.5)*6;
      const r={x:gx*cw+st/2+jx, y:gy*ch+st/2+jy, w:cw-st+(rnd()-0.5)*10, h:ch-st+(rnd()-0.5)*8};
      const pts=rectSamples(r);
      // river
      let bad=false;
      for(const [x,y] of pts){ const c=riverC(x); if(y>c-RHW-22 && y<c+RHW+22){bad=true;break;} }
      if(bad) continue;
      // greens
      for(const g of greens){ for(const [x,y] of pts){
        const d=((x-g.cx)/(g.rx+14))**2+((y-g.cy)/(g.ry+14))**2;
        if(d<1){bad=true;break;} } if(bad)break; }
      if(bad) continue;
      // roads
      for(const rd of roads){ for(let i=0;i<rd.pts.length-1;i++){
        const [ax,ay]=rd.pts[i], [bx,by]=rd.pts[i+1];
        for(const [x,y] of pts){ if(segDist(x,y,ax,ay,bx,by)<rd.w/2+10){bad=true;break;} }
        if(bad)break; } if(bad)break; }
      if(bad) continue;
      // landmark plazas
      for(const m of marks){ const cx=Math.max(r.x,Math.min(m.x,r.x+r.w)), cy=Math.max(r.y,Math.min(m.y,r.y+r.h));
        if(Math.hypot(m.x-cx,m.y-cy)<62){bad=true;break;} }
      if(bad) continue;
      // rail yard
      if(r.y+r.h>1555 && r.y<1665 && r.x+r.w>850 && r.x<2110) continue;
      if(rnd()<0.06) continue; // random plazas
      blocks.push(r);
    }
  }
})();

const S=1.5;
const stat=document.createElement('canvas');
stat.width=WW*S; stat.height=WH*S;
(function paint(){
  const c=stat.getContext('2d'); c.scale(S,S);
  c.fillStyle='#f4f1ec'; c.fillRect(0,0,WW,WH);
  // greens
  for(const g of greens){
    const base=g.old?'#c9cfa8':(g.hill?'#b7d29a':'#c5dcaa');
    for(let i=3;i>=1;i--){
      c.fillStyle=i===3?base:(i===2?'rgba(255,255,255,.10)':'rgba(120,150,90,.16)');
      if(i===3){c.beginPath(); c.ellipse(g.cx,g.cy,g.rx,g.ry,0,0,7); c.fill();}
      else{c.beginPath(); c.ellipse(g.cx,g.cy,g.rx*(i*0.31),g.ry*(i*0.31),0,0,7); c.fill();}
    }
    c.strokeStyle='rgba(110,140,85,.35)'; c.lineWidth=1.5;
    c.beginPath(); c.ellipse(g.cx,g.cy,g.rx*0.66,g.ry*0.66,0,0,7); c.stroke();
    // trees
    const n=Math.floor(g.rx*g.ry/900);
    for(let i=0;i<n;i++){
      const a=rnd()*7, rr=Math.sqrt(rnd());
      const x=g.cx+Math.cos(a)*g.rx*rr*0.92, y=g.cy+Math.sin(a)*g.ry*rr*0.92;
      c.fillStyle=rnd()<0.5?'#8fb573':'#a3c489';
      c.beginPath(); c.arc(x,y,2.5+rnd()*2.5,0,7); c.fill();
    }
  }
  // blocks
  for(const b of blocks){
    const t=rnd();
    c.fillStyle=t<0.33?'#ddd6cd':(t<0.66?'#d9d2c9':'#e0dad2');
    c.beginPath(); c.roundRect(b.x,b.y,b.w,b.h,7); c.fill();
    c.strokeStyle='rgba(120,110,98,.22)'; c.lineWidth=1; c.stroke();
  }
  // main roads over blocks
  for(const rd of roads){
    c.lineCap='round'; c.lineJoin='round';
    c.strokeStyle='rgba(150,142,130,.5)'; c.lineWidth=rd.w+3;
    c.beginPath(); c.moveTo(...rd.pts[0]); for(const p of rd.pts.slice(1)) c.lineTo(...p); c.stroke();
    c.strokeStyle=rd.ped?'#efe6d6':'#fbfaf7'; c.lineWidth=rd.w;
    c.beginPath(); c.moveTo(...rd.pts[0]); for(const p of rd.pts.slice(1)) c.lineTo(...p); c.stroke();
  }
  // rail yard
  c.save(); c.strokeStyle='#b9b2a8'; c.lineWidth=2;
  for(let i=0;i<5;i++){ c.beginPath(); c.moveTo(850,1585+i*14); c.lineTo(2110,1580+i*14); c.stroke(); }
  c.restore();
  // river
  c.beginPath(); c.moveTo(0,riverC(0)-RHW);
  for(let x=0;x<=WW;x+=24) c.lineTo(x,riverC(x)-RHW);
  for(let x=WW;x>=0;x-=24) c.lineTo(x,riverC(x)+RHW);
  c.closePath();
  c.fillStyle='#a3c6e4'; c.fill();
  c.strokeStyle='#8db3d6'; c.lineWidth=3; c.stroke();
  c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=8;
  c.beginPath(); for(let x=0;x<=WW;x+=24){ const y=riverC(x); x===0?c.moveTo(x,y):c.lineTo(x,y);} c.stroke();
  // bridges
  for(const b of bridges){
    const mx=(b.x1+b.x2)/2, top=riverC(mx)-RHW-10, bot=riverC(mx)+RHW+10;
    c.fillStyle=b.covered?'#e5d9c4':'#eeeae3';
    c.strokeStyle='#8a8377'; c.lineWidth=2;
    c.beginPath(); c.roundRect(b.x1+8,top,(b.x2-b.x1)-16,bot-top,5); c.fill(); c.stroke();
    if(b.covered){ c.strokeStyle='#b09a76'; c.lineWidth=2;
      for(let y=top+10;y<bot-6;y+=12){ c.beginPath(); c.moveTo(b.x1+12,y); c.lineTo(b.x2-12,y); c.stroke(); } }
  }
  // labels
  c.textAlign='center'; c.textBaseline='middle';
  try{c.letterSpacing='3px';}catch(e){}
  for(const L of labels){
    c.font=`700 ${L.s}px system-ui,sans-serif`;
    c.fillStyle='rgba(255,255,255,.65)';
    c.fillText(L.t, L.x, L.y+1);
    c.fillStyle='#8b8f7a';
    c.fillText(L.t, L.x, L.y);
  }
  c.save(); c.translate(430,riverC(430)); c.rotate(Math.atan2(riverC(470)-riverC(390),80));
  c.font='italic 700 20px Georgia,serif'; c.fillStyle='rgba(255,255,255,.9)';
  c.fillText('река Марица',0,0); c.restore();
  c.save(); c.translate(1668,860); c.rotate(1.30);
  c.font='700 12px system-ui,sans-serif'; c.fillStyle='#9a948a';
  c.fillText('БУЛ. ЦАР БОРИС III ОБЕДИНИТЕЛ',0,0); c.restore();
  try{c.letterSpacing='0px';}catch(e){}
})();

/* evil Sofia tourists */
function freeSpot(x0,y0){
  if(!hitsBlock(x0,y0,13)&&!hitsRiver(x0,y0,13)) return [x0,y0];
  for(let r=16;r<420;r+=16){
    for(let a=0;a<14;a++){
      const x=x0+Math.cos(a/14*6.283)*r, y=y0+Math.sin(a/14*6.283)*r;
      if(x>16&&x<WW-16&&y>16&&y<WH-16&&!hitsBlock(x,y,13)&&!hitsRiver(x,y,13)) return [x,y];
    }
  }
  return [1345,700];
}
const SPAWNS=[[2060,420],[450,1000],[1660,1350],[880,420]].map(s=>freeSpot(s[0],s[1]));
const CHASE_R=320, CATCH_R=23, CHASE_SP=204, WANDER_SP=118;
let foes=[];
function activeFoes(){ return 2 + (foundCnt>=4?1:0) + (foundCnt>=8?1:0); }
function farSpawn(){
  const sorted=[...SPAWNS].sort((a,b)=>
    Math.hypot(b[0]-P.x,b[1]-P.y)-Math.hypot(a[0]-P.x,a[1]-P.y));
  for(const s of sorted) if(!foes.some(f=>Math.hypot(f.x-s[0],f.y-s[1])<60)) return s;
  return sorted[0];
}
function makeFoe(sp){ return {x:sp[0],y:sp[1],r:11,dir:0,tx:sp[0],ty:sp[1],retarget:0,chasing:false,lx:sp[0],ly:sp[1],stuck:0,unstick:0,ua:0,thiefI:null,thiefT:0,ping:0}; }
function sendHome(f){ const sp=farSpawn(); f.x=sp[0]; f.y=sp[1]; f.tx=sp[0]; f.ty=sp[1]; f.chasing=false; f.unstick=0; }

/* pickups: айрян (спринт) и бъклица (щит) */
const PICKS=[[1340,860,'a'],[700,470,'a'],[1600,1200,'a'],[420,700,'a'],[1010,880,'b'],[1900,600,'b']];
let pickups=[];
function initPickups(){ pickups=PICKS.map(p=>{const [x,y]=freeSpot(p[0],p[1]); return {x,y,type:p[2],on:true,rt:0};}); }
function updatePickups(dt){
  for(const p of pickups){
    if(!p.on){ p.rt-=dt; if(p.rt<=0)p.on=true; continue; }
    if(Math.hypot(p.x-P.x,p.y-P.y)<26){
      p.on=false; p.rt=25; sPickup();
      if(p.type==='a'){ speedT=6; toast('🥛 Айрян! Спринт за 6 секунди'); }
      else{ shield=true; toast('🍶 Бъклица! Ще те спаси от едно хващане'); }
    }
  }
}

function updateFoes(dt){
  while(foes.length<activeFoes()) foes.push(makeFoe(farSpawn()));
  for(const f of foes){
    const dp=Math.hypot(P.x-f.x,P.y-f.y)||1;
    if(f.ping>0) f.ping-=dt;
    let ax,ay,sp;
    if(f.thiefI!=null){
      // fleeing with a stolen landmark
      f.thiefT-=dt; f.chasing=false;
      if(f.thiefArm>0) f.thiefArm-=dt;
      if(state==='play' && f.thiefArm<=0 && dp<CATCH_R+3){
        const i=f.thiefI; f.thiefI=null;
        found[i]=true; foundCnt++; foundOrder.push(i); lockIdx=-1; recoveredCnt++;
        sendHome(f); sCollect(); buzz(60); invuln=1.2;
        toast(`🎉 Настигна крадеца и си върна „${marks[i].n}“!`);
        continue;
      }
      if(f.thiefT<=0){
        const i=f.thiefI; f.thiefI=null; sendHome(f);
        toast(`💨 Крадецът избяга! „${marks[i].n}“ те чака отново на мястото си.`);
        continue;
      }
      if(f.unstick>0){ f.unstick-=dt; ax=Math.cos(f.ua); ay=Math.sin(f.ua); }
      else{ ax=(f.x-P.x)/dp; ay=(f.y-P.y)/dp; }
      sp=198;
    }
    else if(f.unstick>0){ f.unstick-=dt; ax=Math.cos(f.ua); ay=Math.sin(f.ua); sp=CHASE_SP; }
    else if((()=>{ const was=f.chasing; f.chasing = dp<CHASE_R && invuln<=0;
                   if(f.chasing&&!was&&f.ping<=0){ sPing(); f.ping=6; } return f.chasing; })()){
      ax=(P.x-f.x)/dp; ay=(P.y-f.y)/dp; sp=CHASE_SP;
    }
    else{
      f.retarget-=dt;
      const dt2=Math.hypot(f.tx-f.x,f.ty-f.y);
      if(f.retarget<=0||dt2<20){
        const toP=Math.atan2(P.y-f.y,P.x-f.x);
        for(let k=0;k<12;k++){
          // hunt: 60% of patrol legs head roughly toward the player
          const a = rnd()<0.6 ? toP+(rnd()-0.5)*1.3 : rnd()*7;
          const d=140+rnd()*260, nx=f.x+Math.cos(a)*d, ny=f.y+Math.sin(a)*d;
          if(nx>20&&nx<WW-20&&ny>20&&ny<WH-20&&!hitsBlock(nx,ny,f.r)&&!hitsRiver(nx,ny,f.r)){f.tx=nx;f.ty=ny;break;}
        }
        f.retarget=2+rnd()*2;
      }
      ax=(f.tx-f.x)/(dt2||1); ay=(f.ty-f.y)/(dt2||1); sp=WANDER_SP;
    }
    f.dir=Math.atan2(ay,ax);
    const step=sp*(inHill(f.x,f.y)?0.62:1)*dt;
    let nx=f.x+ax*step, ny=f.y+ay*step;
    nx=Math.max(f.r,Math.min(WW-f.r,nx)); ny=Math.max(f.r,Math.min(WH-f.r,ny));
    if(!hitsBlock(nx,f.y,f.r)&&!hitsRiver(nx,f.y,f.r)) f.x=nx;
    if(!hitsBlock(f.x,ny,f.r)&&!hitsRiver(f.x,ny,f.r)) f.y=ny;
    // unstick when cornered (chasing or wandering into a wall)
    f.stuck+=dt;
    if(f.stuck>0.9){
      if(Math.hypot(f.x-f.lx,f.y-f.ly)<12){ f.unstick=0.8; f.ua=rnd()*7; f.retarget=0; }
      f.lx=f.x; f.ly=f.y; f.stuck=0;
    }
    // caught!
    if(f.thiefI==null && state==='play' && invuln<=0 && Math.hypot(P.x-f.x,P.y-f.y)<CATCH_R) caught(f);
  }
}

let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f,t0,dur,type='sine',vol=0.18){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur);
  o.connect(g).connect(AC.destination);
  o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+0.05);
}

/* ================= movement & collision ================= */
function onBridge(x){ return bridges.some(b=>x>b.x1+6&&x<b.x2-6); }
function hitsRiver(x,y,r){
  const c=riverC(x);
  if(y+r>c-RHW-4 && y-r<c+RHW+4) return !onBridge(x);
  return false;
}
function hitsBlock(x,y,r){
  for(const b of blocks){
    const cx=Math.max(b.x,Math.min(x,b.x+b.w)), cy=Math.max(b.y,Math.min(y,b.y+b.h));
    if((x-cx)**2+(y-cy)**2 < r*r) return true;
  }
  return false;
}
function inHill(x,y){
  for(const g of greens) if(g.hill && ((x-g.cx)/g.rx)**2+((y-g.cy)/g.ry)**2<1) return true;
  return false;
}
function move(dt){
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a']||keys['ф'])dx-=1;
  if(keys['arrowright']||keys['d']||keys['в'])dx+=1;
  if(keys['arrowup']||keys['w']||keys['у'])dy-=1;
  if(keys['arrowdown']||keys['s']||keys['я'])dy+=1;
  if(joy&&(joy.dx||joy.dy)){ dx=joy.dx/52; dy=joy.dy/52; }
  const l=Math.hypot(dx,dy);
  if(l<0.01) return;
  if(l>1){dx/=l; dy/=l;}
  P.dir=Math.atan2(dy,dx);
  let sp=235*(speedT>0?1.5:1)*(inHill(P.x,P.y)?0.62:1)*dt;
  let nx=P.x+dx*sp, ny=P.y+dy*sp;
  nx=Math.max(P.r,Math.min(WW-P.r,nx)); ny=Math.max(P.r,Math.min(WH-P.r,ny));
  if(!hitsBlock(nx,P.y,P.r)&&!hitsRiver(nx,P.y,P.r)) P.x=nx;
  if(!hitsBlock(P.x,ny,P.r)&&!hitsRiver(P.x,ny,P.r)) P.y=ny;
}

/* ================= UI panels ================= */
function show(html){ panel.innerHTML=html; ov.classList.remove('hide'); }
function hide(){ ov.classList.add('hide'); }

function startScreen(){
  state='start';
  show(`
    <div class="eyebrow">Игра по туристическата карта</div>
    <h1>ПЛ<span class="pin">О</span>ВДИВ</h1>
    <div class="sub">Градът на тепетата · Древен и вечен</div>
    <div class="rule"></div>
    <p>Ти си турист с карта в ръка. Обиколи стилизирания център на Пловдив и намери всичките <b>12 забележителности</b>, преди времето да изтече.</p>
    <div class="hint"><b>⌨</b> Движение със стрелките / WASD, или задръж и влачи с пръст.</div>
    <div class="hint"><b>❓</b> Всяка забележителност ти задава въпрос: верен отговор +${Q_RIGHT} сек, грешен +${Q_WRONG} сек.</div>
    <div class="hint"><b>😈</b> Злите софийски туристи (жълтите) крадат последната ти забележителност — настигни крадеца до 8 секунди, за да си я върнеш!</div>
    <div class="hint"><b>🥛</b> Айрянът дава спринт, бъклицата 🍶 те пази от едно хващане.</div>
    <div class="hint"><b>🌙</b> В последната минута пада нощ… Реката се минава само по мостовете, по тепетата се върви бавно.</div>
    ${lsGet('pq-best')?`<span class="badge">🏅 Личен рекорд: ${fmtT(+lsGet('pq-best'))}</span>`:''}
    <button id="btn">Тръгвай! (интервал)</button>`);
  document.getElementById('btn').onclick=startGame;
}
function startGame(){
  audio();
  tLeft=START_T; found=marks.map(()=>false); foundCnt=0; elapsed=0;
  foundOrder=[]; invuln=0; foes=[]; lockIdx=-1;
  speedT=0; shield=false; night=0; nightToasted=false; catchCnt=0; recoveredCnt=0;
  initPickups();
  P.x=1345; P.y=800;
  state='play'; hide();
}
let cardIdx=-1;
function openCard(i){
  state='card'; cardIdx=i; cardAnswered=false; sCollect();
  const m=marks[i];
  show(`
    <img class="photo" src="${IMGS[i]}" alt="${m.n}">
    <div class="cred">${IMGCRED[i]}</div>
    <div class="numrow"><div class="num">${i+1}</div>
      <div><h2>${m.n}</h2><div class="sub">${m.en}</div></div></div>
    <p style="font-weight:700">${m.q}</p>
    <div id="opts">${m.o.map((o,k)=>`<button class="opt" data-k="${k}">${k+1}. ${o}</button>`).join('')}</div>
    <div id="factwrap" style="display:none">
      <div class="rule"></div>
      <p>${m.f}</p>
      <span class="bonus" id="bres"></span>
      <button id="btn">Продължи (интервал)</button>
    </div>`);
  cardAnswer=k=>{
    if(cardAnswered||state!=='card') return;
    cardAnswered=true;
    const ok=k===m.a, add=ok?Q_RIGHT:Q_WRONG;
    tLeft+=add;
    panel.querySelectorAll('.opt').forEach((b,j)=>{
      b.disabled=true;
      if(j===m.a) b.classList.add('correct');
      else if(j===k) b.classList.add('wrong');
    });
    const el=document.getElementById('bres');
    el.textContent = ok?`Вярно! +${Q_RIGHT} сек · ${foundCnt}/12 намерени`:`Почти! +${Q_WRONG} сек · ${foundCnt}/12 намерени`;
    if(!ok){ el.style.background='#fdeee9'; el.style.color='#c03f31'; }
    document.getElementById('factwrap').style.display='block';
    document.getElementById('btn').onclick=closeCard;
    ok?sCollect():tone(220,0,0.25,'sine',0.1);
  };
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>cardAnswer(+b.dataset.k));
}
function closeCard(){
  if(state!=='card'||!cardAnswered) return;
  state='play'; hide();
  if(foundCnt===12) winScreen();
}
function winScreen(){
  state='win'; sWin(); buzz([60,40,60]);
  const secs=Math.floor(elapsed);
  const prev=+lsGet('pq-best')||0;
  const newRec=!prev||secs<prev;
  if(newRec) lsSet('pq-best',secs);
  const badges=[];
  if(newRec) badges.push('🏅 НОВ ЛИЧЕН РЕКОРД!');
  if(catchCnt===0) badges.push('🏆 Недосегаем — нито едно хващане');
  if(secs<150) badges.push('⚡ Спринтьор — под 2:30');
  if(recoveredCnt>=2) badges.push('🕵 Ловец на крадци');
  show(`
    <div class="eyebrow">Браво!</div>
    <h2>Обиколи целия град 🎉</h2>
    <div class="rule"></div>
    <p>Намери всичките 12 забележителности от картата на Пловдив.</p>
    <div class="stat">Обиколка за: <b>${fmtT(secs)}</b> · Оставащо време: <b>${fmtT(tLeft)}</b></div>
    <div class="stat">Хващания: <b>${catchCnt}</b> · Върнати от крадци: <b>${recoveredCnt}</b></div>
    <div class="stat">Личен рекорд: <b>${fmtT(newRec?secs:prev)}</b></div>
    <div>${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
    <button id="btn">Нова обиколка</button>`);
  document.getElementById('btn').onclick=startGame;
}
function loseScreen(){
  state='lose'; sLose();
  show(`
    <div class="eyebrow">Времето изтече</div>
    <h2>Градът е по-голям, отколкото изглежда…</h2>
    <div class="rule"></div>
    <p>Успя да намериш <b>${foundCnt} от 12</b> забележителности. Следвай червената стрелка около туриста — и гледай жълтите софиянци да не те докопат.</p>
    <button id="btn">Опитай пак</button>`);
  document.getElementById('btn').onclick=startGame;
}

/* ================= render ================= */
function nearestMark(){
  let bi=-1,bd=1e9;
  for(let i=0;i<12;i++){ if(found[i])continue;
    const d=Math.hypot(marks[i].x-P.x,marks[i].y-P.y);
    if(d<bd){bd=d;bi=i;} }
  return {i:bi,d:bd};
}
function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#e9e5df'; ctx.fillRect(0,0,W,H);
  const camX=Math.max(W/(2*zoom),Math.min(WW-W/(2*zoom),P.x));
  const camY=Math.max(H/(2*zoom),Math.min(WH-H/(2*zoom),P.y));
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom, dpr*(W/2-camX*zoom), dpr*(H/2-camY*zoom));
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(stat,0,0,WW,WH);

  const t=now/1000;
  // night falls in the last minute
  if(night>0.02){
    const g1=ctx.createRadialGradient(P.x,P.y,130,P.x,P.y,340);
    g1.addColorStop(0,'rgba(14,18,38,0)');
    g1.addColorStop(1,`rgba(14,18,38,${(0.78*night).toFixed(3)})`);
    ctx.fillStyle=g1; ctx.fillRect(0,0,WW,WH);
    const fm=marks[5];
    const g2=ctx.createRadialGradient(fm.x,fm.y,0,fm.x,fm.y,150);
    g2.addColorStop(0,`rgba(120,190,255,${(0.35*night).toFixed(3)})`);
    g2.addColorStop(1,'rgba(120,190,255,0)');
    ctx.fillStyle=g2; ctx.fillRect(fm.x-150,fm.y-150,300,300);
  }
  // pickups
  for(const p of pickups){
    if(!p.on) continue;
    const bp=reduceMotion?0:Math.sin(t*3+p.x)*3;
    ctx.beginPath(); ctx.arc(p.x,p.y+bp,13,0,7);
    ctx.fillStyle='rgba(255,253,249,.92)'; ctx.fill();
    ctx.strokeStyle=p.type==='a'?'#7db0d8':'#b08948'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.font='14px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.type==='a'?'🥛':'🍶', p.x, p.y+bp+1);
  }
  // landmarks
  for(let i=0;i<12;i++){
    const m=marks[i], d=Math.hypot(m.x-P.x,m.y-P.y);
    const bob=(!reduceMotion&&!found[i])?Math.sin(t*3+i)*2.5:0;
    const y=m.y+bob;
    if(!found[i]&&d<300&&!reduceMotion){
      ctx.beginPath(); ctx.arc(m.x,m.y,26+8*Math.sin(t*4),0,7);
      ctx.strokeStyle='rgba(213,73,58,.4)'; ctx.lineWidth=3; ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(m.x,y+4); ctx.lineTo(m.x-7,y-8); ctx.lineTo(m.x+7,y-8); ctx.closePath();
    ctx.fillStyle=found[i]?'#3f9d6d':'#d5493a'; ctx.fill();
    ctx.beginPath(); ctx.arc(m.x,y-16,15,0,7);
    ctx.fillStyle=found[i]?'#3f9d6d':'#d5493a'; ctx.fill();
    ctx.strokeStyle='#fffdf9'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='800 14px system-ui,sans-serif';
    ctx.fillText(found[i]?'✓':String(i+1), m.x, y-15.5);
  }
  // evil Sofia tourists
  for(const f of foes){
    ctx.beginPath(); ctx.ellipse(f.x,f.y+9,10,4,0,0,7); ctx.fillStyle='rgba(50,40,30,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7);
    ctx.fillStyle='#e6b83c'; ctx.fill();
    ctx.strokeStyle='#8a6d1c'; ctx.lineWidth=2.5; ctx.stroke();
    // angry face turned toward heading
    const fx=Math.cos(f.dir)*3.5, fy=Math.sin(f.dir)*3.5;
    for(const s of [-1,1]){
      const ex=f.x+fx+s*3.6*Math.cos(f.dir+Math.PI/2), ey=f.y+fy+s*3.6*Math.sin(f.dir+Math.PI/2);
      ctx.beginPath(); ctx.arc(ex,ey,1.9,0,7); ctx.fillStyle='#33261a'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex-3*Math.cos(f.dir+Math.PI/2)*s, ey-3*Math.sin(f.dir+Math.PI/2)*s-3);
      ctx.lineTo(ex+2*Math.cos(f.dir+Math.PI/2)*s, ey+2*Math.sin(f.dir+Math.PI/2)*s-1);
      ctx.strokeStyle='#33261a'; ctx.lineWidth=1.6; ctx.stroke();
    }
    if(f.thiefI!=null){
      const bb=reduceMotion?0:Math.sin(t*6)*2;
      ctx.beginPath(); ctx.arc(f.x,f.y-27+bb,10,0,7);
      ctx.fillStyle='#d5493a'; ctx.fill();
      ctx.strokeStyle='#fffdf9'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='800 11px system-ui,sans-serif';
      ctx.fillText(String(f.thiefI+1), f.x, f.y-27+bb);
      ctx.fillStyle='#c03f31'; ctx.font='900 12px system-ui,sans-serif';
      ctx.fillText(Math.ceil(f.thiefT)+'с', f.x, f.y-45+bb);
    }else if(f.chasing){
      ctx.fillStyle='#d5493a'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='900 16px system-ui,sans-serif';
      ctx.fillText('!', f.x, f.y-22-(reduceMotion?0:Math.abs(Math.sin(t*8))*3));
    }else{
      ctx.fillStyle='#8a6d1c'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='800 8px system-ui,sans-serif';
      ctx.fillText('СФ', f.x, f.y-16);
    }
  }
  // player (blinks while invulnerable)
  if(invuln<=0 || Math.floor(t*10)%2===0){
    ctx.beginPath(); ctx.ellipse(P.x,P.y+9,10,4,0,0,7); ctx.fillStyle='rgba(50,40,30,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(P.x,P.y,P.r,0,7);
    ctx.fillStyle='#2b6cb0'; ctx.fill();
    ctx.strokeStyle='#fffdf9'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(P.x+Math.cos(P.dir)*7,P.y+Math.sin(P.dir)*7,3.2,0,7);
    ctx.fillStyle='#fffdf9'; ctx.fill();
  }
  // compass: points at the thief while one is fleeing, otherwise at the nearest target
  const thf=foes.find(f=>f.thiefI!=null);
  const nm=nearestMark();
  let ca=null, cc='#d5493a';
  if(thf&&state==='play'){ ca=Math.atan2(thf.y-P.y,thf.x-P.x); cc='#e6b83c'; }
  else if(nm.i>=0&&nm.d>120&&state==='play'){ ca=Math.atan2(marks[nm.i].y-P.y,marks[nm.i].x-P.x); }
  if(ca!=null){
    ctx.save(); ctx.translate(P.x+Math.cos(ca)*44,P.y+Math.sin(ca)*44); ctx.rotate(ca);
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-7); ctx.lineTo(-2,0); ctx.lineTo(-6,7); ctx.closePath();
    ctx.fillStyle=cc; ctx.fill();
    ctx.strokeStyle='#fffdf9'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }
  // joystick
  if(joy){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.beginPath(); ctx.arc(joy.x0,joy.y0,52,0,7);
    ctx.fillStyle='rgba(51,57,63,.10)'; ctx.fill();
    ctx.strokeStyle='rgba(51,57,63,.30)'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(joy.x0+joy.dx,joy.y0+joy.dy,22,0,7);
    ctx.fillStyle='rgba(43,108,176,.85)'; ctx.fill();
  }
  drawMini();
}
function drawMini(){
  const sc=mini.width/WW;
  mctx.clearRect(0,0,mini.width,mini.height);
  mctx.fillStyle='#f4f1ec'; mctx.fillRect(0,0,mini.width,mini.height);
  for(const g of greens){
    mctx.fillStyle=g.hill?'#b7d29a':'#c5dcaa';
    mctx.beginPath(); mctx.ellipse(g.cx*sc,g.cy*sc,g.rx*sc,g.ry*sc,0,0,7); mctx.fill();
  }
  mctx.strokeStyle='#a3c6e4'; mctx.lineWidth=7;
  mctx.beginPath();
  for(let x=0;x<=WW;x+=60){ const y=riverC(x); x===0?mctx.moveTo(x*sc,y*sc):mctx.lineTo(x*sc,y*sc); }
  mctx.stroke();
  for(let i=0;i<12;i++){
    mctx.beginPath(); mctx.arc(marks[i].x*sc,marks[i].y*sc,2.6,0,7);
    mctx.fillStyle=found[i]?'#3f9d6d':'#d5493a'; mctx.fill();
  }
  for(const f of foes){
    const th=f.thiefI!=null;
    mctx.beginPath(); mctx.arc(f.x*sc,f.y*sc,th?3.4:2.6,0,7);
    mctx.fillStyle=th?'#d5493a':'#e6b83c'; mctx.fill();
    mctx.strokeStyle=th?'#e6b83c':'#8a6d1c'; mctx.lineWidth=th?1.4:0.8; mctx.stroke();
  }
  mctx.beginPath(); mctx.arc(P.x*sc,P.y*sc,3.4,0,7);
  mctx.fillStyle='#2b6cb0'; mctx.fill();
  mctx.strokeStyle='#fff'; mctx.lineWidth=1.2; mctx.stroke();
}

/* ================= main loop ================= */
let last=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000||0); last=now;
  if(state==='play'){
    move(dt);
    if(invuln>0) invuln-=dt;
    if(speedT>0) speedT-=dt;
    updateFoes(dt);
    updatePickups(dt);
    if(tLeft<60&&!nightToasted){ nightToasted=true; toast('🌙 Свечерява се над Пловдив!'); }
    elapsed+=dt; tLeft-=dt;
    if(tLeft<=0){ tLeft=0; loseScreen(); }
    for(let i=0;i<12;i++){
      const dm=Math.hypot(marks[i].x-P.x,marks[i].y-P.y);
      if(i===lockIdx){ if(dm>60) lockIdx=-1; else continue; }
      if(!found[i]&&dm<34){
        found[i]=true; foundCnt++; foundOrder.push(i); openCard(i);
      }
    }
  }
  const mm=Math.floor(tLeft/60), ss=String(Math.floor(tLeft%60)).padStart(2,'0');
  timeEl.textContent=`${mm}:${ss}`;
  timeChip.classList.toggle('low', tLeft<30);
  cntEl.textContent=`${foundCnt}/12`;
  night+=((tLeft<60?1:0)-night)*Math.min(1,dt*1.5);
  const th=foes.find(f=>f.thiefI!=null);
  const nm=nearestMark();
  tgtEl.textContent = th ? `⚠ Дръж крадеца! ${Math.ceil(th.thiefT)} сек`
    : (nm.i<0 ? 'Готово!' : `${nm.i+1}. ${marks[nm.i].n} · ${Math.round(nm.d)} м`);
  const bf=[];
  if(speedT>0) bf.push(`🥛 ${Math.ceil(speedT)}с`);
  if(shield) bf.push('🍶 щит');
  const buffChip=document.getElementById('buff');
  buffChip.style.display=bf.length?'flex':'none';
  document.getElementById('buffVal').textContent=bf.join(' · ');
  draw(now);
  requestAnimationFrame(frame);
}
startScreen();
requestAnimationFrame(frame);
</script>
